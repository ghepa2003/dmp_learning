# runs_manifest.yaml - manifest dei run per tools/canonical_metrics.py (schema_version 1).
# Tutti i campi sono obbligatori (kt null solo con kt_source unknown|not_applicable).
# kt_source: yaml_commit | script_argument | inferred_from_error | unknown | not_applicable
#   (script_argument e not_applicable ESTENDONO l'elenco richiesto: Kt passato come argomento a uno
#    script del repo che riscrive lo yaml prima del run / controllore di velocita' senza Kt.)
# frame_at_recording: frame controllato al momento della registrazione. Fonte: commit bf8d818
#   (2026-08-28) porta ee_frame_name da fer_link8 a fer_hand_tcp nello yaml del repo; verificato sui
#   dati (test_actual_pose_matches_fk_tcp): ultima riga di actual_pose == FK TCP di joint_states.
# recorded_utc: starting_time del bag (metadata.yaml), UTC.
# bag: cartella del bag rosbag2 (relativa alla cartella di questo file), usata per header.stamp (sim_time).
