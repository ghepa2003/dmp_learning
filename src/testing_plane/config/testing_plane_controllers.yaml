# ros2_control configuration for the 6-DOF moving testing plane simulation object.
# The object has 3 prismatic joints (trasl_x, trasl_y, trasl_z) and 3 revolute joints (rot_x, rot_y, rot_z).

/testing_plane/controller_manager:
  ros__parameters:
    update_rate: 500  # Controller update loop rate in Hz
    use_sim_time: true

    # State broadcaster for all 6 degrees of freedom
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Joint group velocity controller for velocity commands
    testing_plane_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    # Joint group position controller for kinematic trajectory and position commands
    testing_plane_position_controller:
      type: position_controllers/JointGroupPositionController

/testing_plane/joint_state_broadcaster:
  ros__parameters:
    joints:
      - testing_plane_trasl_x_joint
      - testing_plane_trasl_y_joint
      - testing_plane_trasl_z_joint
      - testing_plane_rot_x_joint
      - testing_plane_rot_y_joint
      - testing_plane_rot_z_joint
    state_interfaces:
      - position
      - velocity

/testing_plane/testing_plane_velocity_controller:
  ros__parameters:
    joints:
      - testing_plane_trasl_x_joint
      - testing_plane_trasl_y_joint
      - testing_plane_trasl_z_joint
      - testing_plane_rot_x_joint
      - testing_plane_rot_y_joint
      - testing_plane_rot_z_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

/testing_plane/testing_plane_position_controller:
  ros__parameters:
    joints:
      - testing_plane_trasl_x_joint
      - testing_plane_trasl_y_joint
      - testing_plane_trasl_z_joint
      - testing_plane_rot_x_joint
      - testing_plane_rot_y_joint
      - testing_plane_rot_z_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity