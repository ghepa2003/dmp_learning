/testing_plane/controller_manager:
  ros__parameters:
    update_rate: 500
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    testing_plane_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    testing_plane_position_controller:
      type: position_controllers/JointGroupPositionController

/testing_plane/joint_state_broadcaster:
  ros__parameters:
    joints:
      - testing_plane_trasl_x_joint
      - testing_plane_trasl_y_joint
      - testing_plane_trasl_z_joint
      - testing_plane_rot_x_joint
      - testing_plane_rot_y_joint
      - testing_plane_rot_z_joint
    state_interfaces:
      - position
      - velocity

/testing_plane/testing_plane_velocity_controller:
  ros__parameters:
    joints:
      - testing_plane_trasl_x_joint
      - testing_plane_trasl_y_joint
      - testing_plane_trasl_z_joint
      - testing_plane_rot_x_joint
      - testing_plane_rot_y_joint
      - testing_plane_rot_z_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

/testing_plane/testing_plane_position_controller:
  ros__parameters:
    joints:
      - testing_plane_trasl_x_joint
      - testing_plane_trasl_y_joint
      - testing_plane_trasl_z_joint
      - testing_plane_rot_x_joint
      - testing_plane_rot_y_joint
      - testing_plane_rot_z_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity