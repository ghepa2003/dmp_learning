# Controller Manager Configuration for Franka Emika / FER in Gazebo Sim
# Defines active controllers and their loop update rates (1000 Hz real-time control).
controller_manager:
  ros__parameters:
    update_rate: 1000  # Controller manager execution frequency in Hz

    # Standard Franka example controllers
    joint_position_example_controller:
      type: franka_example_controllers/JointPositionExampleController

    joint_velocity_example_controller:
      type: franka_example_controllers/JointVelocityExampleController

    joint_impedance_example_controller:
      type: franka_example_controllers/JointImpedanceExampleController

    forward_torque_controller:
      type: franka_example_controllers/ForwardTorqueController

    # State Broadcasters
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

    # Custom Co-manipulation / Research Controllers
    joint_velocity_controller:
      type: comanip_controllers/JointVelocityController

    # Cartesian Velocity Controller (Kinematic Differential IK on command_interfaces: velocity)
    velocity_cartesian_controller:
      type: franka_cartesian_control/CartesianVelocityController

    # Cartesian Impedance Controller (Dynamic Compliance Control on command_interfaces: effort)
    cartesian_impedance_controller:
      type: franka_cartesian_control/CartesianImpedanceController

    # Gripper: forward position commands to the LEADER finger joint only.
    # fer_finger_joint2 follows in software via <mimic> (gz_ros2_control), so it
    # exposes no command_interface and is not driven by any controller.
    # gripper_controller (ForwardCommandController) rimosso: fer_finger_joint1
    # ora comandato via ignition::gazebo::systems::JointPositionController
    # (plugin nativo) + ros_gz_bridge su /gripper_position_cmd, non piu' via
    # ros2_control (bug non risolto in franka_ign_ros2_control: joint_position_cmd
    # non si aggiorna mai per questo giunto, vedi thesis notes).

# --- Controller Specific Parameter Blocks ---

joint_position_example_controller:
  ros__parameters:
    gazebo: true

joint_velocity_example_controller:
  ros__parameters:
    gazebo: true
  
joint_impedance_example_controller:
  ros__parameters:
    k_gains:
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 10.0
      - 6.0
      - 2.0
    d_gains:
      - 2.0
      - 2.0
      - 2.0
      - 1.0
      - 1.0
      - 1.0
      - 0.5

joint_velocity_controller:
  ros__parameters:
    gazebo: true

# Parameters for Cartesian Velocity Controller (Differential Kinematics & DLS Inverse Kinematics)
velocity_cartesian_controller:
  ros__parameters:
    joint_names:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    ee_frame_name: fer_hand_tcp
    target_pose_topic: /target_pose
    kp_linear: 1.0              # Proportional gain for translational task-space error (s^-1)
    kp_angular: 1.0             # Proportional gain for rotational task-space error (s^-1)
    damping_lambda: 0.05        # Damped Least Squares regularizer lambda to avoid kinematic singularities
    max_linear_speed: 0.15      # Translational end-effector velocity clamp (m/s)
    max_angular_speed: 0.5      # Rotational end-effector angular velocity clamp (rad/s)
    max_joint_speed: 1.5        # Joint velocity limit clamp (rad/s)
    # Velocity feedforward: v_cmd = v_ff + Kp * e. DISABLED by default so the
    # controller stays byte-identical to the pre-feedforward Kp-only law; flip
    # to true for the A/B comparison against the same recorded runs (kp_linear/
    # kp_angular/damping_lambda above are intentionally untouched by this).
    feedforward_enabled: false
    target_twist_topic: /target_twist
    feedforward_tolerance_sec: 0.05   # max age / cross-topic stamp skew accepted for v_ff before falling back to Kp-only

# Parameters for Cartesian Impedance Controller (Task-Space Dynamic Compliance & Nullspace Posture)
cartesian_impedance_controller:
  ros__parameters:
    joint_names:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    ee_frame_name: fer_hand_tcp
    target_pose_topic: /target_pose
    translational_stiffness: 200.0
    rotational_stiffness: 150.0
    translational_damping: 10.0
    rotational_damping: 1.0
    nullspace_stiffness: 0.2         # Nullspace posture stiffness K_ns (Nm/rad)
    joint1_nullspace_stiffness: 100.0 # High stiffness dedicated to base yaw joint to prevent drift
    delta_tau_max: 1.0               # Maximum torque rate of change per iteration (Nm/ms)
    nullspace_pinv_damping: 0.05     # Damping for Jacobian transpose nullspace pseudoinverse
    compensate_gravity_internally: false # Set false in Gazebo (Gazebo physics engine applies gravity)
    enable_nullspace_leak_diagnostics: true # Publish nullspace task-space leak acceleration diagnostics
    enable_contact_force_estimation: true

# Parameters for the gripper forward-command controller.
# Only the leader joint is listed: fer_finger_joint2 mimics fer_finger_joint1 in
# software (gz_ros2_control) and has no command_interface.
