# Worked example, using the repo's own DEFAULT CubeSatelliteModel::Params (axis_world=z,
# face_normal_body=x) and the author's 2026-09-28 decision (spin about world Z). satellite_q_ref is
# identity here BECAUSE free_target_object is spawned at roll=pitch=yaw=0: PhaseTracker's theta=0
# then coincides with that spawn orientation, and CubeSatelliteModel's internal B matrix cancels out
# of the theta-tracking identity regardless of its own value (see DESIGN_NOTES.md / the grasp planner
# node's plan review: R(axis,theta)*B vs. R(axis,theta) - B is theta-independent and factors out).
# If you change axis_world/face_normal_body/the physical spin axis, satellite_q_ref must still satisfy
# checkQRefOnAxis (a rotation about satellite_rotation_axis) - it does NOT need to equal any B matrix.

# Satellite center/axis below are the production values: center = (0.75, 0.0, 0.35), axis = (0, 0, 1).
# free_target_object MUST be spawned at exactly x=0.75 y=0.0 z=0.35 (launch args x/y/z): the node's
# first odometry sample must be within 10 mm of satellite_rotation_center (checkFirstOdomSample) or
# the node fails loud. The cube must ALREADY be spinning (wz below) when the planner starts: the very
# first sample is also checked against satellite_rotation_angular_velocity_deg_s
# (checkOmegaConsistency) - a sample taken before the spin starts (twist ~= 0) fails that check.

/**:
  ros__parameters:
    satellite_rotation_axis: [0.0, 0.0, 1.0]
    satellite_rotation_center: [0.75, 0.0, 0.35]
    satellite_rotation_angular_velocity_deg_s: -2.0   # signed: CW seen from +axis, matches free_target_object's wz below
    satellite_odom_topic: "/free_target_object/odometry"
    satellite_q_ref: [0.0, 0.0, 0.0, 1.0]              # x, y, z, w - identity

grasp_planner_node:
  ros__parameters:
    use_sim_time: true
    demo_params_path: "/absolute/path/to/demo_params.yaml"
    urdf_path: "/absolute/path/to/robot.urdf"
    min_delay_s: 0.05
    robot_base_world: [0.0, 0.0, 0.0]      # MUST be (near-)zero - see checkRobotBaseWorldIsZero
    # center_world/axis_world below are IGNORED by the selection pipeline (buildSelectionInputs()
    # overwrites both with the snapshot's satellite_rotation_center/axis) - they exist here only so
    # checkCubeCenterMatchesRotationCenter/checkCubeAxisMatchesRotationAxis can catch a typo'd mismatch.
    cube_geometry.center_world: [0.75, 0.0, 0.35]      # MUST equal satellite_rotation_center
    cube_geometry.axis_world: [0.0, 0.0, 1.0]           # MUST equal satellite_rotation_axis
    cube_geometry.cube_side_m: 0.150
    cube_geometry.standoff_m: 0.08
    cube_geometry.collar_radius_m: 0.0725   # OUTER radius of the collar cylinder (collision, SDF)
    # Radius of the grasp points on the rim (mid-wall). Optional: if omitted it defaults to collar_radius_m,
    # which replicates the behaviour from before this parameter existed.
    cube_geometry.grasp_radius_m: 0.068
    cube_geometry.face_normal_body: [1.0, 0.0, 0.0]
    cube_geometry.wall_thickness_m: 0.009
    omega_consistency_tol_deg_per_s: 0.1
    q_ref_consistency_tol_deg: 0.5
    robot_base_world_tol_m: 1.0e-6
    grasp_command_topic: "/grasp_command"
    # Optional start configuration of the selection: 7 values in fer_joint1..7 order (rad), finite and within the
    # URDF joint limits. Empty / unset (default) = RobotModel::readyPose() (or demo_params start_joints_rad if the
    # file has it). When set it wins over the demo file. p0 / start_position then are FK(this q).
    # start_joints_override_rad: [0.0, -0.785398, 0.0, -2.356194, 0.0, 1.570796, 0.785398]

    # Selection (selectGraspS3): reduced problem, position-only deformation distance + constraints, velocity and
    # path checked a posteriori. All s1.* are optional; the values below are the defaults.
    # s1.length_scale_m: 0.10          # l in d = sqrt(d_pos^2/l^2 + orientation_weight*ori^2/angle_scale^2)
    # s1.orientation_weight: 0.0       # 0 = distance on position only
    # s1.angle_scale_rad: 1.0
    # s1.epsilon_wait_per_s: 1.0e-4    # cost = d + epsilon * wait_s
    # s1.w_hat_min: 0.5                # constraint: w_trans / w_trans_demo >= w_hat_min
    # s1.margin_min_rad: 0.3           # constraint: min joint-limit margin of the IK solution
    # s1.r_trust_m: 0.30               # constraint: d_pos <= r_trust
    # s1.delta_v_max_m_s: 3.0e-3       # post-hoc: |v_target - v_ProDMP| at contact
    # s1.theta_step_deg: 2.0           # coarse theta scan over [-180, 180)
    # s1.theta_refine_step_deg: 0.1    # refinement of the best candidate of each k, +- theta_step_deg
    # s1.posthoc_path_check: true      # post-hoc: checkKinematicFeasibility along the ProDMP path
    # s1.posthoc_velocity_check: true  # false: skip the velocity check (e.g. demo that ends at rest)
    # s1.max_posthoc_candidates: 10    # max number of post-hoc checks actually performed
    # s1.posthoc_cluster_deg: 10.0     # post-hoc: skip a candidate of the same k within this theta distance of one already checked (0 = off)
    # s1.ik.pos_tol_m: 1.0e-4
    # s1.ik.ori_tol_rad: 1.0e-3
    # s1.ik.max_iter: 300
    # s1.ik.damping: 0.05
    # s1.ik.nullspace_gain: 1.0
    # s1.ik.max_step_rad: 0.2

# Shown only to document the shared-YAML idea (D3): this node's satellite_rotation_* / satellite_q_ref
# / satellite_odom_topic parameters above are meant to be read by prodmp_gazebo_executor_node too, via
# the /**: wildcard section. That node's own parameters (Task 2, out of scope here) are unchanged.
# prodmp_gazebo_executor_node:
#   ros__parameters:
#     ...

# free_target_object (separate package, out of scope - shown for reference only):
#   ros2 launch free_target_object free_target_object.launch.py x:=0.75 y:=0.0 z:=0.35 \
#     wx:=0.0 wy:=0.0 wz:=-0.034906585
#   # x/y/z MUST match satellite_rotation_center above (10 mm tolerance, checkFirstOdomSample).
#   # -0.034906585 rad/s = -2 deg/s (clockwise seen from +z), matching
#   # satellite_rotation_angular_velocity_deg_s above. Launch it (and let it start spinning) BEFORE
#   # the planner node subscribes, or the first sample may be checked against a not-yet-spinning cube.
