haptic_dmp_wrapper_node:
  ros__parameters:
    n_basis: 200
    alpha_x: 4.6
    alpha_z: 25.0
    beta_z: 6.25
    master_pose_topic: "/master_pose_raw"
    output_yaml_path: "/root/thesis_ws/dmp_weights.yaml"
    output_demo_csv_path: "/root/thesis_ws/demo_raw.csv"

csv_master_pose_player_node:
  ros__parameters:
    demo_csv_path: "/root/thesis_ws/real_demo/reach_task_baseline.csv"
    master_pose_topic: "/master_pose_raw"
    buttons_topic: "/touch0/buttons"
    # Raw Geomagic base frame. The player republishes CSV rows verbatim with no
    # transform, so the data is still in omni_base; the fixed omni_base ->
    # fer_link0 correction is applied by the consumer nodes (see
    # core/frame_correction.hpp), not here.
    frame_id: "omni_base"
    publish_rate_hz: 200.0
    startup_delay_sec: 1.0

live_demo_recorder_node:
  ros__parameters:
    n_basis: 200
    alpha_x: 4.6
    alpha_z: 25.0
    beta_z: 6.25
    master_pose_topic: "/master_pose_raw"
    target_pose_topic: "/target_pose"
    buttons_topic: "/touch0/buttons"
    output_yaml_path: "/root/thesis_ws/live_demo_dmp_weights.yaml"
    output_demo_csv_path: "/root/thesis_ws/live_demo_raw.csv"

# ROS node name is "demo_replay_sync_orchestrator" (the executable is
# demo_replay_sync_orchestrator_node); the key below must match the node name.
demo_replay_sync_orchestrator:
  ros__parameters:
    # Gripper position command [m] treated as fully open (ramp start / initial cmd).
    gripper_open_position: 0.06
    # Gripper position command [m] treated as fully closed (ramp end).
    gripper_closed_position: 0.0
    # Duration [s] of the SPACE-triggered linear close ramp (slow approach, no bounce).
    gripper_close_ramp_duration_sec: 2.0

dmp_gazebo_executor_node:
  ros__parameters:
    # Gripper position command [m] treated as fully open (ramp start).
    gripper_open_position: 0.06
    # Gripper position command [m] treated as fully closed (ramp end).
    gripper_closed_position: 0.0
    # Duration [s] of the CSV-triggered linear close ramp during autonomous replay.
    gripper_close_ramp_duration_sec: 2.0
