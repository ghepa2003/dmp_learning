haptic_dmp_wrapper_node:
  ros__parameters:
    n_basis: 200
    alpha_x: 4.6
    alpha_z: 25.0
    beta_z: 6.25
    master_pose_topic: "/master_pose_raw"
    output_yaml_path: "/root/thesis_ws/dmp_weights.yaml"
    output_demo_csv_path: "/root/thesis_ws/demo_raw.csv"

csv_master_pose_player_node:
  ros__parameters:
    demo_csv_path: "/root/thesis_ws/real_demo/reach_task_baseline.csv"
    master_pose_topic: "/master_pose_raw"
    buttons_topic: "/touch0/buttons"
    # Raw Geomagic base frame. The player republishes CSV rows verbatim with no
    # transform, so the data is still in omni_base; the fixed omni_base ->
    # fer_link0 correction is applied by the consumer nodes (see
    # core/frame_correction.hpp), not here.
    frame_id: "omni_base"
    publish_rate_hz: 200.0
    startup_delay_sec: 1.0

live_demo_recorder_node:
  ros__parameters:
    n_basis: 200
    alpha_x: 4.6
    alpha_z: 25.0
    beta_z: 6.25
    master_pose_topic: "/master_pose_raw"
    target_pose_topic: "/target_pose"
    buttons_topic: "/touch0/buttons"
    output_yaml_path: "/root/thesis_ws/live_demo_dmp_weights.yaml"
    output_demo_csv_path: "/root/thesis_ws/live_demo_raw.csv"
    # Anchored /target_pose (default off): the published pose is the master motion relative to its
    # first sample, applied on the anchor; the first message equals the anchor. The CSV/DMP still
    # receive the corrected master pose. Requires skip_initial_alignment=true in the controller
    # (see DESIGN_NOTES.md). Enabling it without both arrays, a wrong length, or |q| != 1 +- 1e-6
    # is a start-up error.
    # anchor_enabled: false
    # anchor_position_m: [0.4, 0.0, 0.5]              # [x, y, z] in fer_link0
    # anchor_orientation_xyzw: [1.0, 0.0, 0.0, 0.0]   # unit quaternion [x, y, z, w]

# ROS node name is "demo_replay_sync_orchestrator" (the executable is
# demo_replay_sync_orchestrator_node); the key below must match the node name.
demo_replay_sync_orchestrator:
  ros__parameters:
    # Gripper position command [m] treated as fully open (ramp start / initial cmd).
    gripper_open_position: 0.06
    # Gripper position command [m] treated as fully closed (ramp end).
    gripper_closed_position: 0.0
    # Duration [s] of the SPACE-triggered linear close ramp (slow approach, no bounce).
    gripper_close_ramp_duration_sec: 2.0
    # Demo-mode buttons. "single_button" (default): ONE stylus button pressed 3 times =
    # start, trigger + gripper close, stop (SPACE counts as a press of the same button;
    # buttons[1] is ignored). "legacy": buttons[0] start, buttons[1] stop, SPACE trigger.
    # NOTE: csv_master_pose_player_node emits start/stop on buttons[0]/[1]: use "legacy" with it.
    # button_scheme: "single_button"
    # button_index: 0
    # debounce_s: 0.30

dmp_gazebo_executor_node:
  ros__parameters:
    # Gripper position command [m] treated as fully open (ramp start).
    gripper_open_position: 0.06
    # Gripper position command [m] treated as fully closed (ramp end).
    gripper_closed_position: 0.0
    # Duration [s] of the CSV-triggered linear close ramp during autonomous replay.
    gripper_close_ramp_duration_sec: 2.0
    # One-shot target retarget: the live free_target_object position is read once
    # from this odometry topic at rollout start and applied via DMP setGoal
    # (translation only; orientation keeps the demo goal).
    target_odom_topic: "/free_target_object/odometry"
    # Fail-loud: abort the node if no odometry arrives within this many seconds.
    target_odom_timeout_sec: 5.0
    # Whether the target-odometry wait/retarget is mandatory. true (default):
    # wait for target_odom_topic and retarget the goal to the live target, aborting
    # on timeout - correct for replay against a simulated target. false: skip the
    # subscription, wait and retarget entirely and replay the demo's ORIGINAL goal
    # as-is - for an open-loop run with no target at all (e.g. real hardware).
    target_odom_required: true

prodmp_gazebo_executor_node:
  ros__parameters:
    # Same values as dmp_gazebo_executor_node (see above): world_frame/ee_frame/
    # control_rate_hz/startup_delay_sec are not overridden there either, so
    # these mirror that node's code defaults for a like-for-like comparison.
    world_frame: "world"
    ee_frame: "fer_hand_tcp"
    control_rate_hz: 200.0
    startup_delay_sec: 1.0
    # Gripper position command [m] treated as fully open (ramp start).
    gripper_open_position: 0.06
    # Gripper position command [m] treated as fully closed (ramp end).
    gripper_closed_position: 0.0
    # Duration [s] of the CSV-triggered linear close ramp during autonomous replay.
    gripper_close_ramp_duration_sec: 2.0
    # One-shot target retarget: the live free_target_object position is read once
    # from this odometry topic at rollout start and applied via ProDMP setGoal
    # (translation only; orientation keeps the demo goal).
    target_odom_topic: "/free_target_object/odometry"
    # Fail-loud: abort the node if no odometry arrives within this many seconds.
    target_odom_timeout_sec: 5.0
    # Whether the target-odometry wait/retarget is mandatory. true (default):
    # wait for target_odom_topic and retarget the goal to the live target, aborting
    # on timeout - correct for replay against a simulated target. false: skip the
    # subscription, wait and retarget entirely and replay the demo's ORIGINAL goal
    # as-is - for an open-loop run with no target at all (e.g. real hardware).
    target_odom_required: true
    # Goal source. "parameters" (default, nothing below is read) or "grasp_command": the goal, theta_star and
    # contact_time come from a satellite_grasp_msgs/GraspCommand published by grasp_planner_node. Requires
    # satellite_rotation_enabled=true, satellite_rotation_mode="continuous", satellite_phase_source="measured",
    # target_odom_required=false, use_sim_time=true, and satellite_intercept_phase_deg / satellite_contact_time_s
    # NOT set. satellite_rotation_axis/center/angular_velocity_deg_s, satellite_odom_topic and satellite_q_ref
    # must be the same values the planner uses.
    # Continuous mode only. true (default): a satellite rotation more than 0.5 deg off satellite_rotation_axis is fatal
    # in every state. false: still fatal BEFORE the trigger; from the trigger on (contact with the cube is intended)
    # the deviation is only recorded (max, first instant above 0.25 / 0.5 deg, counts) in the AT_END log, in
    # ~/continuous_status (axis_dev_*) and in the node's shutdown log.
    # axis_deviation_fatal_after_trigger: true
    # grasp_goal_source: "grasp_command"
    # grasp_command_topic: "/grasp_command"
    # grasp_command_timeout_s: 300.0          # sim time, finite > 0
    # grasp_command_max_age_s: 0.0            # <= 0 disables the age check (future stamps are always rejected)
    # omega_consistency_tol_deg_per_s: 0.1    # message omega vs satellite_rotation_angular_velocity_deg_s
    # grasp_command_phase_tol_deg: 1.0        # phase vs planner snapshot, checked once on the first odometry sample
    # robot_base_world: [0.0, 0.0, 0.0]       # MANDATORY in this mode, must be ~0
    # robot_base_world_tol_m: 1.0e-6
    # Hold target (grasp_command mode only): the EE pose is read ONCE from TF right after skip_initial_alignment=true is
    # set and republished on target_pose_topic until the rollout starts, so the controller (zero torque until its first
    # target, no watchdog afterwards) does not let the TCP drift while the node waits for the command and the trigger.
    # hold_target_enabled: true               # bool
    # hold_target_rate_hz: 10.0               # finite, in (0, 200]
    # Rollout orientation, MANDATORY in grasp_command mode (no default; a missing or unknown value is a start-up error
    # naming the parameter). Not declared in any other mode.
    #   demo_native : the QuaternionDMP of the demonstration (the behaviour before this parameter existed).
    #   planner_goal: SLERP from the hold quaternion (read once from TF) to GraspCommand.goal_pose.orientation with the
    #                 planner's s(t) = min(1, elapsed/tau); constant angular velocity on the twist topic; the goal
    #                 orientation is kept after at_end. Requires hold_target_enabled=true.
    # grasp_orientation_mode: "planner_goal"  # or "demo_native"
    # NOTE: weights_yaml_path / orientation_weights_yaml_path are intentionally
    # NOT set here - they are run_id-dependent and passed via -p by the
    # orchestrator.

grasp_force_calibration_node:
  ros__parameters:
    # One-shot event announcing the gripper close ramp has finished; force capture
    # triggers on this (gated by the geometric-grasp signal). Identical to the
    # node's hardcoded default - kept here so it can be retargeted without a rebuild.
    gripper_close_complete_topic: "/gripper_close_complete"
